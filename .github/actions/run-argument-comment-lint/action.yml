name: Run argument comment lint
description: Check Rust call sites with the Cargo lint wrapper.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-ci
    - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
      with:
        toolchain: nightly-2026-08-20
        components: rustc-dev, llvm-tools-preview, rust-src
    - shell: bash
      run: just argument-comment-lint
