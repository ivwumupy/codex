name: Build Cargo voice inputs
description: Prepare the native voice SDK and runtime for a matching Linux or macOS runner.
inputs:
  target:
    description: Native target triple matching the runner
    required: true
  upload:
    description: Upload the SDK and runtime for downstream test jobs
    default: 'true'
outputs:
  root:
    description: Directory containing the staged SDK and runtime
    value: ${{ steps.stage.outputs.root }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -y
        sudo apt-get install -y build-essential cmake pkg-config libasound2-dev patchelf
    - name: Build and stage native dependencies
      id: stage
      working-directory: third_party/voice
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        work="$(mktemp -d "$RUNNER_TEMP/voice.XXXXXXXX")"
        mkdir "$work/archives"
        while IFS=$'\t' read -r archive url; do
          curl --fail --location --retry 3 "$url" -o "$work/archives/$archive"
        done < <(jq -r '.sources[] | [.archive, .url] | @tsv' sources.json)
        platform_args=()
        if [[ "$RUNNER_OS" == macOS ]]; then
          platform_args+=(--deployment-target 14.0)
        fi
        python3 build_native.py --target "$TARGET" --archives "$work/archives" --output "$work/build" \
          --cc "$(command -v cc)" --cxx "$(command -v c++)" --cmake "$(command -v cmake)" \
          --make "$(command -v make)" --pkg-config "$(command -v pkg-config)" --shell "$(command -v bash)" \
          "${platform_args[@]}"
        printf 'STABLE_GIT_COMMIT %s\n' "$GITHUB_SHA" > "$work/status"
        python3 prepare_built_runtime.py --prefix "$work/build/prefix" --build-receipt "$work/build/built.json" \
          --status "$work/status" --target "$TARGET" --output "$work/runtime" --sdk-output "$work/sdk"
        python3 cargo_ci.py stage --sdk "$work/sdk" --runtime "$work/runtime" --output "$work/staged" --target "$TARGET"
        echo "root=$work/staged" >> "$GITHUB_OUTPUT"
    - if: inputs.upload == 'true'
      shell: bash
      env:
        ROOT: ${{ steps.stage.outputs.root }}
      run: tar -czf "$RUNNER_TEMP/cargo-voice.tar.gz" -C "$ROOT" sdk runtime
    - if: inputs.upload == 'true'
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: cargo-voice-${{ inputs.target }}
        path: ${{ runner.temp }}/cargo-voice.tar.gz
        if-no-files-found: error
        overwrite: true
